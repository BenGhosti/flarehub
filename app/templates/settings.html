<!DOCTYPE html>
<html lang="en" data-theme="{{ default_theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ app_name }} - Settings</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="/static/auth.js"></script>
    {% if auth_required %}
    <script>
        // No token in sessionStorage => new browser visit => force login
        if (!getAuthToken()) window.location.replace('/login');
    </script>
    {% endif %}
</head>
<body class="with-sidebar">
    {% include "nav.html" %}

    <div class="container" style="max-width: 640px;">
        <h1 class="page-title">Settings</h1>

        <!-- System & data storage (no admin unlock required) -->
        <div class="card" style="text-align:left;">
            <h3 style="margin-bottom: 1rem;">System &amp; Data Storage</h3>
            <div id="storage-stats-container">
                <div class="storage-grid" aria-hidden="true">
                    <div class="storage-item"><span class="skeleton skeleton-value"></span><span class="skeleton skeleton-label"></span></div>
                    <div class="storage-item"><span class="skeleton skeleton-value"></span><span class="skeleton skeleton-label"></span></div>
                    <div class="storage-item"><span class="skeleton skeleton-value"></span><span class="skeleton skeleton-label"></span></div>
                    <div class="storage-item"><span class="skeleton skeleton-value"></span><span class="skeleton skeleton-label"></span></div>
                    <div class="storage-item"><span class="skeleton skeleton-value"></span><span class="skeleton skeleton-label"></span></div>
                    <div class="storage-item"><span class="skeleton skeleton-value"></span><span class="skeleton skeleton-label"></span></div>
                </div>
            </div>
            <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.5rem;">
                <div>
                    <span style="font-size: 0.85rem;">Last collector run: <strong id="collector-last-run">â€“</strong></span>
                    <p id="collector-last-message" style="font-size: 0.78rem; opacity: 0.65; margin-top: 2px;"></p>
                </div>
                <button id="btn-run-collector" type="button" class="btn-small">Run now</button>
            </div>
        </div>

        <div class="card" style="text-align:left;">
            <h3 style="margin-bottom: 0.75rem;">Admin Area</h3>
            <p style="font-size: 0.85rem; opacity: 0.75; margin-bottom: 1rem;">
                Passkey management, database maintenance, log viewer and privacy options
                have moved to the dedicated admin page (protected by the admin token).
            </p>
            <a href="/admin" style="text-decoration:none;">
                <button type="button" class="btn-small">Go to admin area</button>
            </a>
        </div>
    </div>

    <script>
        // --- Theme (localStorage + server default) ---
        const savedTheme = localStorage.getItem('theme') || '{{ default_theme }}';
        document.documentElement.setAttribute('data-theme', savedTheme);
        applyThemeIcon(savedTheme);

        function toggleTheme() {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            applyThemeIcon(next);
        }

        function applyThemeIcon(theme) {
            document.querySelectorAll('.moon').forEach(p => p.style.display = theme === 'dark' ? 'none' : '');
            document.querySelectorAll('.sun').forEach(p => p.style.display = theme === 'dark' ? '' : 'none');
        }

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

        function fmtRelativeTime(isoString) {
            if (!isoString) return 'never';
            const diffMs = Date.now() - new Date(isoString + 'Z').getTime();
            const diffMin = Math.round(diffMs / 60000);
            if (diffMin < 1) return 'just now';
            if (diffMin < 60) return `${diffMin} min. ago`;
            const diffH = Math.round(diffMin / 60);
            return `${diffH} h ago`;
        }

        async function loadStorageStats() {
            const container = document.getElementById('storage-stats-container');
            const res = await authFetch('/api/collector/status');
            if (!res.ok) {
                container.innerHTML = '<p style="opacity:0.6; font-size:0.9rem;">Could not load statistics.</p>';
                return;
            }
            const data = await res.json();
            const s = data.storage;
            container.innerHTML = `
                <div class="storage-grid">
                    <div class="storage-item">
                        <span class="storage-value">${s.raw_snapshots}</span>
                        <span class="storage-label">Raw data points<br><span style="opacity:0.6;">(10-min resolution)</span></span>
                    </div>
                    <div class="storage-item">
                        <span class="storage-value">${s.hourly_rollups}</span>
                        <span class="storage-label">Hourly rollups</span>
                    </div>
                    <div class="storage-item">
                        <span class="storage-value">${s.daily_rollups}</span>
                        <span class="storage-label">Daily rollups<br><span style="opacity:0.6;">(long-term history)</span></span>
                    </div>
                    <div class="storage-item">
                        <span class="storage-value">${s.threat_events}</span>
                        <span class="storage-label">Security feed entries</span>
                    </div>
                    <div class="storage-item">
                        <span class="storage-value">${s.country_stats}</span>
                        <span class="storage-label">Country stats<br><span style="opacity:0.6;">(passive)</span></span>
                    </div>
                    <div class="storage-item">
                        <span class="storage-value">${s.status_code_stats}</span>
                        <span class="storage-label">Status code stats<br><span style="opacity:0.6;">(passive)</span></span>
                    </div>
                </div>
                <p style="font-size: 0.78rem; opacity: 0.6; margin-top: 0.75rem;">
                    Raw data is automatically compacted into hourly and daily rollups
                    (see RAW_RETENTION_HOURS / HOURLY_RETENTION_DAYS / DATA_RETENTION_DAYS in the .env),
                    which keeps the database small even over years of operation.
                </p>
            `;

            const lastRunEl = document.getElementById('collector-last-run');
            const lastMsgEl = document.getElementById('collector-last-message');
            if (data.last_run) {
                lastRunEl.textContent = fmtRelativeTime(data.last_run.timestamp) +
                    (data.last_run.success ? ' Â· OK' : ' Â· Error');
                lastRunEl.style.color = data.last_run.success ? 'var(--highlight-color)' : 'var(--danger-color)';
                lastMsgEl.textContent = data.last_run.message || '';
            } else {
                lastRunEl.textContent = 'never';
            }
        }

        document.getElementById('btn-run-collector')?.addEventListener('click', async (e) => {
            e.target.disabled = true;
            e.target.textContent = 'Running...';
            try {
                await authFetch('/api/collector/run-now', { method: 'POST' });
                await loadStorageStats();
            } finally {
                e.target.disabled = false;
                e.target.textContent = 'Run now';
            }
        });

        loadStorageStats();
    </script>
</body>
</html>

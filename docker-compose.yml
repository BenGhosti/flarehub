services:
  flarehub:
    build: .
    container_name: flarehub
    restart: unless-stopped
    # Container runs as UID 1001 (non-root). The mounted host directory
    # must be writable by UID 1001, run once:
    #   chown -R 1001:1001 ./data
    # External (host) port, configurable via HOST_PORT in the .env (default 1111).
    # The internal port stays APP_PORT (8000) inside the container.
    ports:
      - "${HOST_PORT:-1111}:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Berlin}
    # Note: Docker Compose interpolates env_file values. If a value in .env
    # contains "$" (e.g. a bcrypt hash), escape it as "$$". Plaintext values
    # (like AUTH_PIN) are unaffected.
